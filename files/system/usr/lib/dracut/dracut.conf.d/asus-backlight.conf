# Force ASUS WMI modules and udev rule into initramfs for LUKS prompt
# This is needed to allow the keyboard backlight to work on ASUS laptops when the system is locked at the LUKS prompt.
# The modprobe config is loaded here since it would be ignored otherwise
add_drivers+=" asus_wmi asus_nb_wmi "
install_items+=" /usr/lib/udev/rules.d/90-asus-keyboard-backlight.rules /usr/lib/modprobe.d/asus-wmi.conf "