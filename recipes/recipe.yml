---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: blue-scroll
# description will be included in the image's metadata
description: Custom Fedora atomic image for developer workflows and gaming on a scrolling WM (Niri + Dux Shell).

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia-open
image-version: 44 # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # 1. CONFIGURATION FILES

  # This copies lots of configuration files into the correct places
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /


  # 2. FONTS

  # Install some fonts, including Nerd Fonts and Google Fonts.
  - type: fonts
    fonts:
        nerd-fonts:
          - FiraCode # don't add spaces or "Nerd Font" suffix
          - Hack
          - SourceCodePro
          - Terminus
          - JetBrainsMono
          - NerdFontsSymbolsOnly
        google-fonts:
          - Roboto
          - Open Sans
          - Inter


  # 3. FINGERPRINT

  # Install custom fprinting shim for my ASUS Vivobook fingerprint reader
  - type: script
    scripts:
      - fingerprint.sh

  # Enable the custom resume service for the fingerprint reader to work after suspend
  - type: systemd
    system:
      enabled:
        - fprintd-resume.service


  # 4. APPLICATIONS

  # Install ProtonVPN client with systemd offline mode to avoid failure during post installation
  - type: script
    scripts:
      - protonvpn.sh

  # Install default native packages for my workflow (some packages might already be included in the base image)
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
        - https://download.opensuse.org/repositories/shells:zsh-users:zsh-completions/Fedora_Rawhide/shells:zsh-users:zsh-completions.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      copr:
        - jdxcode/mise
        - atim/starship
        - avengemedia/danklinux
        - avengemedia/dms
      nonfree: negativo17
    install:
      packages:
        # 1. Desktop packages (niri + Dux Shell)
        - niri
        - repo: copr:copr.fedorainfracloud.org:avengemedia/danklinux
          packages:
            - cava
            - cliphist
            - dankcalendar
            - danksearch
            - dgop
            - dms-greeter
            - dux-files
            - ghostty
            - greetd
            - gtk4-layer-shell
            - material-symbols-fonts
            - matugen
            - qt6ct-kde
            - quickshell
            - xwayland-satellite
        - repo: copr:copr.fedorainfracloud.org:avengemedia/dms
          packages:
            - dms

        # 2. Desktop extras
        - chezmoi
        - adw-gtk3-theme
        - qt6-qtmultimedia
        - qt6-qtimageformats
        - i2c-tools
        - wtype
        - kdeconnectd
        - gnome-disk-utility
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - https://mega.nz/linux/repo/Fedora_%OS_VERSION%/x86_64/megasync-Fedora_%OS_VERSION%.x86_64.rpm
        - nautilus
        - https://mega.nz/linux/repo/Fedora_%OS_VERSION%/x86_64/nautilus-megasync-Fedora_%OS_VERSION%.x86_64.rpm
        - https://bitwarden.com/download/?app=desktop&platform=linux&variant=rpm
        - gnome-keyring
        - gnome-keyring-pam
        - udisks2
        - gvfs
        - gvfs-mtp
        - tuned
        - tuned-ppd
        - firewalld
        - libva-nvidia-driver

        # 3. Gaming packages
        - steam
        - steam-devices
        - gamemode
        - gamemode.i686
        - mangohud
        - mangohud.i686
        - nvidia-driver-libs.i686
        - nvidia-driver-cuda-libs.i686
        - mesa-vulkan-drivers.i686
        - mesa-libGL.i686

        # 4. Development tools
        - code
        - mise
        - podman-docker
        - git
        - git-lfs
        - git-delta
        - gh
        - gdb
        - strace
        - ltrace
        - btop
        - jq
        - tmux
        - micro
        - gcc
        - gcc-c++
        - make
        - cmake
        - ninja-build

        # 5. Shell utilities
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - zsh-completions
        - starship
        - bat
        - zoxide
        - eza
        - fzf
        - ripgrep
        - fd-find

  # Pre-populate /etc/skel with official Dux Shell + Niri default configs at build time
  - type: script
    scripts:
      - dms-skel.sh

  # Install default flatpak packages for my workflow
  - type: default-flatpaks
    configurations:        
      - notify: false
        scope: system
        install:
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.kolunmi.Bazaar
          - net.nokyan.Resources
          - org.gnome.baobab
          - org.gnome.Calculator
          - org.gnome.Clocks
          - org.gnome.FileRoller
          - app.drey.KeyRack
          - com.ranfdev.DistroShelf
          - io.github.diegopvlk.Cine
          - org.gnome.Loupe
          - org.gnome.Papers
          - io.github.screwys.Rufin
          - io.gitlab.adhami3310.Impression
          - io.github.seadve.Kooha
          - com.github.PintaProject.Pinta
          - app.zen_browser.zen
          - com.discordapp.Discord
          - org.telegram.desktop
      - notify: false
        scope: system
        repo:
          url: https://chrisdkn.github.io/Amethyst-Mod-Manager/amethyst.flatpakrepo
          name: modmanager-origin
          title: Amethyst Mod Manager
        install:
          - io.github.Amethyst.ModManager

  - type: systemd
    system:
      enabled:
        - greetd.service
        - tuned.service
        - tuned-ppd.service
        - nvidia-powerd.service
        - firewalld.service
    user:
      enabled:
        # Enable the rootless podman socket for all users upon login
        - podman.socket
        - gnome-keyring-daemon.socket
        - dms-init-configs.service

  # Allow kdeconnect through firewall
  - type: script
    scripts:
      - firewall.sh


  # 5. FINALIZATION

  - type: initramfs # this regenerates the initramfs to apply any changes made to the kernel modules or drivers
      
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
